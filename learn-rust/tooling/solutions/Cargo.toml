[package]
name = "solutions"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

# The solutions live in ../../chapters/NN-*/solutions/*.rs, one test target each.
# The [[test]] list at the bottom is generated: run `cargo rl sync-manifests`
# after adding, renaming or removing a file. Run one with:
#   cargo test -p solutions --test c01_e01_variables

[dependencies]
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
glob-match = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tower = { workspace = true }
bytes = { workspace = true }
pin-project-lite = { workspace = true }
proptest = { workspace = true }
# The procedural macros for chapter 18 live in their own crate (proc-macro crates must).
macros = { package = "solution-macros", path = "../../chapters/18-macros/solution-macros" }
databroker = { workspace = true }
databroker-proto = { workspace = true }

[lints.rust]
# `deny` (not `forbid`) so the unsafe chapters can opt in per file with
# `#![allow(unsafe_code)]` — every other file stays unsafe-free.
unsafe_code = "deny"
# Exercises often define helpers that only tests use.
dead_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Every `unsafe {}` block in a solution must carry a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"

